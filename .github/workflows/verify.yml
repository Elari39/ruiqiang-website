name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [system, bundled]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        if: matrix.browser == 'system'
      - run: npm run verify
        if: matrix.browser == 'system'
      - run: npm run verify:netlify
        if: matrix.browser == 'bundled'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence-${{ matrix.browser }}
          path: |
            tests/probe-out/
            _shot/
            .next/probe-run.json
