# Netlify 部署配置（当前唯一部署目标：ruiqiang-jianzhu.netlify.app）。
#
# 这份文件是**增量**的：只对 Netlify 生效，其他平台完全忽略它。
# next.config.ts 不绑定任何平台（只有一条平台无关的 poweredByHeader:false），
# 源码侧零平台锁定 —— 换平台时增删这一个文件即可，不需要改任何源码。
#
# 走法 A（Netlify 的 Next.js 运行时）就是下面这个 plugin。
# 走法 B（output:"export" 纯静态导出）才不需要它，但那会连带关掉 next/image
# 的服务端优化并要求 images.unoptimized: true，本项目不采用。
#
# ⚠️ 更正（2026-09-28 复核）：本项目**全站没有使用 next/image**。
#    components/SiteImage.tsx 手写 <picture>，直接引用 scripts/build-images.mjs
#    预生成的 1600/800 两档 AVIF/WebP 实体文件。因此上面提到的
#    "next/image 优化端点"在本项目里既不是走法 A 的收益，也不构成风险。
#    插件之所以仍然必需，是因为 App Router 的路由分发与服务端产物要靠它接管 ——
#    只写 publish=".next" 会让 _next/static 之外的东西静默失效。

[build]
  command = "npx playwright install --with-deps chromium && npm run verify"
  publish = ".next"

# 必须显式声明这个插件。
# 只写 publish = ".next" 而不装插件时，Netlify 会把 .next 当成纯静态目录直传，
# 结果是 _next/static 之外的东西（App Router 路由分发、服务端产物）全部失效。
# 插件会接管这些，行为与官方 Next 托管最接近。
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ⚠️ 响应头按「谁来产生这个响应」分工，**每个响应头都只有一个来源**。
#
# 部署后逐项核对线上响应头得出的结论（2026-09-28）：
#   `[[headers]] for = "/*"` 对静态资源完全生效，但对 HTML 页面只生效一半。
#     for = "/*" 时：资源 ✅✅✅ ／ 页面 ❌❌✅（只留下 nosniff）
#   HTML 响应由 Netlify 的 Next.js 运行时接管，它自带一套响应头，
#   `/*` 规则里只有一部分能透到最终响应 —— 于是"点击劫持防线"（X-Frame-Options）
#   在所有 HTML 页面上其实并不存在。
#
# 反过来，把安全头全搬到 next.config.ts 的 headers() 之后又实测到：
#   Next 产生响应 → 三个头齐全；但**由 Netlify 边缘直接吐出的静态文件不吃 headers()**：
#     页面 / ／ robots.txt ／ sitemap.xml /gallery → ✅✅✅
#     /images/* ／ /_next/static/*                → ❌❌❌
#
# 所以最终按来源分家，互不重叠：
#   Next 运行时产生的响应（HTML / robots.txt / sitemap.xml）→ next.config.ts
#   Netlify 边缘直接服务的静态文件（/images/*、/_next/static/*）→ 本文件
# 这样既没有"写了不生效"，也没有"同一个头两处配置导致漂移"。

# public/images/ 下的文件名不含内容哈希（形如 storefront-1600.webp），
# 所以这里用一周而非一年 —— 重新跑 npm run images 换图后，
# immutable 会让用户长时间拿到旧图。
#
# nosniff 在这里补上：这些文件由 Netlify 边缘直接吐出，**不受 next.config.ts
# 的 headers() 管辖**（实测：那一层只覆盖 Next 运行时产生的响应）。
# 对静态资源而言 nosniff 是有意义的 —— 它阻止浏览器把一个 MIME 不符的文件
# 嗅探成别的类型来执行。

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
    X-Content-Type-Options = "nosniff"

# Next.js 的静态产物自带内容哈希，可以放心长缓存。
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"
